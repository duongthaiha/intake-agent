# Deployment pipeline — azd provision + deploy (dev only)
#
# Topology: the private Foundry/Functions dev environment has no public
# network path, so this workflow's Azure-facing steps run on an ephemeral,
# repo-scoped, event-driven Azure Container Apps Job runner living inside
# the same VNet (label below) — never on ubuntu-latest. See
# scripts/azure/runner/ and infra/modules/runner-job.bicep for the runner
# itself, and scripts/azure/bootstrap-runner.sh for the one-time/rotation
# bootstrap (image build + PAT secret) that must be run once, out of band,
# before this workflow can ever pick up a job.
#
# Trigger: automatically after CI succeeds on main (workflow_run), or an
# approved manual redeploy (workflow_dispatch). Deliberately NOT triggered
# by push/pull_request directly — this is a public repo, and pull_request
# events (including workflow_run's own event, when misused) can carry
# fork-controlled content; workflow_run only exposes the *result* of a
# separately-vetted CI run on a protected branch, and workflow_dispatch is
# only ever triggered by a human with write access. Both are safe to hand
# to a private, VNet-connected self-hosted runner.
#
# Manual dispatch accepts an optional `ref` recovery input. It does not widen
# the trust boundary: workflow_dispatch is still pinned to refs/heads/main (so
# the workflow definition and the approval gate always come from the protected
# branch), the input must be a full 40-character commit SHA, and that commit
# must be proven an ancestor of origin/main before any Azure credential is
# obtained. Automatic runs ignore it entirely and always deploy the head SHA
# of the successful CI run.
#
# Every run additionally requires approval via the GitHub `dev` Environment
# (required reviewers configured in repo Settings → Environments — see the
# deployment runbook / final Tank report for the exact one-time setup).
#
# Required GitHub repository configuration (Settings → Secrets and variables → Actions):
#
#   Repository or `dev` Environment variables (non-secret):
#     AZURE_CLIENT_ID        — Application (client) ID of the federated service principal (OIDC deployment identity)
#     AZURE_TENANT_ID        — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID  — Target subscription ID
#     AZURE_ENV_NAME         — azd environment name (must be dev)
#     AZURE_LOCATION         — Azure region (e.g. eastus2)
#     AZURE_PRINCIPAL_ID     — Object ID of the federated service principal
#
#   Secrets: none in GitHub — OIDC federation removes the need for a stored
#   Azure credential, and the GitHub runner-registration PAT lives ONLY as
#   an Azure Container Apps Job secret, never in GitHub.
#
# Required Azure setup (one-time, performed by Tank or the deploying engineer
# — see scripts/azure/bootstrap-runner.sh and the final report for the full
# checklist): Entra app registration + federated credential (subject
# `repo:<owner>/<repo>:environment:dev`) with Contributor + User Access
# Administrator on the target resource group; the `dev` GitHub Environment
# with required reviewers; repository/environment variables above; and the
# one-time runner image build + PAT bootstrap.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Optional recovery commit SHA to redeploy. Must be a full 40-character
          commit SHA that is already an ancestor of origin/main; anything else
          is rejected before Azure login. Leave empty to deploy main's HEAD.
        required: false
        type: string
        default: ''

permissions:
  actions: read    # Validate a manual recovery SHA had a successful main CI run
  id-token: write   # Required for OIDC token exchange
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false  # Never cancel an in-progress deploy

jobs:
  deploy:
    name: azd provision + deploy (dev)
    # Only run for an explicit human-triggered redeploy, or a workflow_run
    # whose CI conclusion was a genuine success on main. Any other
    # workflow_run conclusion (failure, a PR branch, a fork) is a no-op —
    # this guard is the second layer, on top of the trigger filter above,
    # that keeps this job from ever picking up unvetted content.
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, aca-intake-dev]
    environment: dev

    steps:
      - name: Checkout (CI-verified commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history is required to prove ancestry of an optional manual
          # recovery commit against origin/main in the next step.
          fetch-depth: 0

      # Optional manual recovery, deliberately narrow so it cannot weaken the
      # trust model:
      #   * workflow_dispatch itself is still restricted to refs/heads/main by
      #     the job `if:` guard above, so the workflow definition, this
      #     verification logic, and the `dev` Environment approval all come
      #     from the protected branch — never from the requested commit.
      #   * the input must be a full 40-character commit SHA (no branch, tag,
      #     or short SHA, which are ambiguous or attacker-movable), and
      #   * `git merge-base --is-ancestor` must prove that exact commit is
      #     already reachable from origin/main, and the Actions API must show a
      #     successful push-triggered CI run for that exact SHA. A commit that
      #     is not an ancestor or lacks successful CI is rejected here before
      #     any Azure credential is obtained.
      # Automatic runs never take this path: they always deploy the head SHA
      # of the successful CI run on main.
      - name: Verify manual recovery ref is an ancestor of main
        if: github.event_name == 'workflow_dispatch' && inputs.ref != ''
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full 40-character lowercase commit SHA; got '${REQUESTED_REF}'"
            exit 1
          fi
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if ! git cat-file -e "${REQUESTED_REF}^{commit}" 2>/dev/null; then
            echo "::error::${REQUESTED_REF} is not a commit in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${REQUESTED_REF}" refs/remotes/origin/main; then
            echo "::error::${REQUESTED_REF} is not an ancestor of origin/main; refusing to deploy unvetted content"
            exit 1
          fi
          ci_runs="$(
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${REQUESTED_REF}&event=push&status=completed&per_page=100"
          )"
          if ! jq --exit-status --arg sha "${REQUESTED_REF}" \
            'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .conclusion == "success")' \
            <<<"${ci_runs}" >/dev/null; then
            echo "::error::${REQUESTED_REF} has no successful push-triggered CI run on main"
            exit 1
          fi
          git checkout --quiet --detach "${REQUESTED_REF}"
          echo "Deploying CI-verified main ancestor ${REQUESTED_REF}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}

      - name: Record deployed commit
        run: |
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # Fixes the confirmed root cause of every prior failed Deploy run:
      # Azure/setup-azd@v1 does not exist. v2 is the current major.
      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0

      # Mandatory per official Microsoft Foundry CI/CD guidance — azd has no
      # built-in knowledge of Foundry hub/project/agent resources without
      # this extension. Its absence was previously masked by the setup-azd
      # failure happening first; this is now installed explicitly so the
      # dependency is visible and auditable in workflow logs.
      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      # Log in using workload identity federation — no secrets stored.
      # Runner identity is intentionally NOT used for this: the Container
      # Apps Job's managed identity can only pull its image. GitHub OIDC is
      # the sole Azure deployment identity.
      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Authenticate azd with the same OIDC federation (separate from the
      # az CLI login above — azd maintains its own credential cache).
      - name: azd auth (federated)
        run: azd auth login --federated-credential-provider github
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The steady-state template is scoped to the existing dev resource group.
      # Runner bootstrap resources are intentionally absent from azd provision.
      - name: Set azd environment
        run: |
          azd env new "${AZURE_ENV_NAME}" --no-prompt || azd env select "${AZURE_ENV_NAME}"
          azd env set AZURE_LOCATION "${AZURE_LOCATION}"
          azd env set AZURE_SUBSCRIPTION_ID "${AZURE_SUBSCRIPTION_ID}"
          azd env set AZURE_RESOURCE_GROUP "rg-intake-dev"
          azd env set AZURE_PRINCIPAL_ID "${AZURE_PRINCIPAL_ID}"
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}

      # What-if before provisioning. Parameters mirror main.parameters.json
      # exactly (scripts/azure/what-if.sh no longer diverges from the real
      # provision inputs — see that script's header comment). Blocking: a
      # what-if failure means the template itself is broken and must not
      # proceed to a real provision.
      - name: Bicep what-if
        run: bash scripts/azure/what-if.sh "${AZURE_ENV_NAME}" "${AZURE_LOCATION}"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_RESOURCE_GROUP: rg-intake-dev
          AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}

      - name: Upload what-if evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: what-if-${{ vars.AZURE_ENV_NAME }}
          path: what-if-*.json
          if-no-files-found: warn
          retention-days: 30

      # Provision infrastructure. Foundry + Hosted Agent are unconditional
      # (the ineffective deployFoundry toggle has been removed from Bicep —
      # it always hardcoded true in main.parameters.json, so the parameter
      # never actually changed behavior).
      - name: azd provision
        run: azd provision --no-prompt
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Deploy application code (Functions, Container Apps job image).
      - name: azd deploy
        run: azd deploy --no-prompt
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Post-deploy verification is BLOCKING (no continue-on-error): a failed
      # smoke check means the deployment did not actually work and the run
      # must be marked failed, not green. `set -o pipefail` keeps `tee` from
      # masking that failure while still capturing the full transcript as
      # uploadable evidence.
      # postprovision only reconciles idempotent Hosted Agent RBAC. Full
      # verification occurs here, after application deployment.
      #
      # The script resolves AZURE_AI_PROJECT_ENDPOINT and AZURE_AI_ACCOUNT_NAME
      # from `azd env get-value` when they are absent from the OS environment
      # — azd injects Bicep outputs into hook processes only, never into an
      # ordinary workflow step, which is why this step previously aborted on
      # its first line.
      - name: Post-deploy verification
        run: |
          set -o pipefail
          bash scripts/azure/post-deploy-verify.sh 2>&1 | tee post-deploy-verify.log
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: rg-intake-dev

      # Evidence is most valuable exactly when verification fails, so both the
      # artifact upload and the summary run unconditionally. Neither masks the
      # blocking failure above: the job's conclusion is already sealed by that
      # step.
      - name: Upload post-deploy verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-deploy-verify-${{ vars.AZURE_ENV_NAME }}
          path: post-deploy-verify.log
          if-no-files-found: warn
          retention-days: 30

      - name: Post-deploy verification summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Post-deploy verification"
            echo ""
            if [[ ! -s post-deploy-verify.log ]]; then
              echo "No verification transcript was produced (the step did not run or failed to start)."
              exit 0
            fi
            grep -E '^  (Passed|Failed): ' post-deploy-verify.log | sed 's/^  /- /' || true
            echo ""
            if grep -q '❌' post-deploy-verify.log; then
              echo "Failed checks:"
              echo ""
              grep '❌' post-deploy-verify.log | sed 's/^  ❌ /- /'
            else
              echo "All post-deploy checks passed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
