# CI pipeline — credential-free quality gates for PRs and pushes to main.
# Does NOT deploy and does NOT run live Azure or evaluation tests.
# Deployment is handled by deploy.yml; the durability/evaluation gates run
# separately on an approved VNet-connected runner (see
# docs/quality/test-strategy.md and docs/contracts/integration-gates.md).
#
# Every job below is blocking: no `continue-on-error`, no "skip if tool
# missing" fallbacks. A green run is real evidence, not a masked failure.
#
# Required repository variables/secrets: none. This workflow uses no Azure
# credentials.
#
# Branch protection: require the single "Required Checks" job
# (job id `required-checks`) as the status check. It fails whenever any
# gate below fails, errors, or is cancelled.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Bicep validation — build + lint all Bicep files
  # ---------------------------------------------------------------------------
  bicep-validate:
    name: Bicep Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build main.bicep (syntax check)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint all Bicep files
        run: |
          az bicep lint --file infra/main.bicep
          az bicep lint --file infra/bootstrap-runner.bicep
          for f in infra/modules/*.bicep; do
            echo "Linting $f"
            az bicep lint --file "$f"
          done

      - name: Validate Azure shell scripts
        run: |
          set -euo pipefail
          for script in scripts/azure/*.sh scripts/azure/runner/*.sh \
            scripts/azure/runner/hooks/*.sh; do
            bash -n "$script"
          done

  # ---------------------------------------------------------------------------
  # Lint + strict type-check (Ruff, mypy --strict via pyproject.toml)
  # ---------------------------------------------------------------------------
  lint-and-types:
    name: Lint and Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/ evaluation/ --output-format=github

      - name: Mypy type-check (strict; see [tool.mypy] in pyproject.toml)
        run: mypy src/

  # ---------------------------------------------------------------------------
  # Import boundary enforcement (import-linter contracts)
  # ---------------------------------------------------------------------------
  import-boundaries:
    name: Import Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import-linter contracts
        run: lint-imports

  # ---------------------------------------------------------------------------
  # PR-gate pytest suite: unit, contract, component, security, accessibility
  # Coverage gate enforced via .coveragerc (source=src/intake_domain,
  # fail_under=80) — the single source of truth for the coverage threshold.
  # ---------------------------------------------------------------------------
  pr-tests:
    name: PR Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run PR-gate tests under coverage
        run: |
          coverage run -m pytest \
            -m "unit or contract or component or security or accessibility" \
            -v --tb=short --junitxml=pytest-report.xml

      - name: Coverage gate (intake_domain >= 80%, see .coveragerc)
        run: |
          coverage report -m
          coverage xml -o coverage.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-test-evidence
          path: |
            pytest-report.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Merge-to-main integration suite (LocalAdapter, in-memory — no Azure creds)
  # Only runs on push to main; skipped (not required) on PRs.
  # Excludes `azure`-marked tests: those require an approved VNet runner and
  # live outside this dev-only pipeline.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration suite (excludes azure-marked tests)
        run: |
          pytest -m "integration and not azure" -v --tb=short \
            --junitxml=integration-report.xml

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-evidence
          path: integration-report.xml
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Bandit — blocks only on HIGH severity findings (-lll)
  # ---------------------------------------------------------------------------
  bandit-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bandit (blocking on HIGH severity)
        run: bandit -r src/ -lll -f json -o bandit-report.json

      - name: Upload Bandit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Trivy secret scan — blocking on any detection
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Trivy Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          output: trivy-secrets-report.txt
          exit-code: '1'

      - name: Upload secret-scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-secret-scan-report
          path: trivy-secrets-report.txt
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Trivy IaC scan — compile Bicep first, then block on HIGH/CRITICAL findings
  # ---------------------------------------------------------------------------
  iac-scan:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bicep CLI
        run: az bicep install

      # Trivy does not scan .bicep source directly. Compile each entry point
      # and module into an isolated ARM JSON directory so this gate cannot pass
      # merely because it found zero supported files.
      - name: Compile Bicep for security scanning
        run: |
          set -euo pipefail
          mkdir -p .trivy-iac/modules
          az bicep build --file infra/main.bicep --outfile .trivy-iac/main.json
          az bicep build \
            --file infra/bootstrap-runner.bicep \
            --outfile .trivy-iac/bootstrap-runner.json
          for source in infra/modules/*.bicep; do
            module="$(basename "${source%.bicep}")"
            az bicep build \
              --file "$source" \
              --outfile ".trivy-iac/modules/${module}.json"
          done

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .trivy-iac/
          severity: 'HIGH,CRITICAL'
          format: table
          output: trivy-iac-report.txt
          exit-code: '1'

      - name: Upload IaC scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-iac-scan-report
          path: trivy-iac-report.txt
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Required Checks — single stable aggregate for branch protection.
  # Runs unconditionally (`if: always()`) and fails if any dependency
  # failed, errored, or was cancelled. `integration-tests` may be `skipped`
  # ONLY when the triggering event is not a push to `refs/heads/main` (i.e.
  # on PRs, where it is intentionally PR-exempt). On a push to main,
  # integration-tests is mandatory: an unexpected skip there must fail this
  # aggregate, since a skip proves nothing and must not be mistaken for a
  # passing gate before deployment eligibility.
  # ---------------------------------------------------------------------------
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - bicep-validate
      - lint-and-types
      - import-boundaries
      - pr-tests
      - integration-tests
      - bandit-scan
      - secret-scan
      - iac-scan
    steps:
      - name: Verify all required gates succeeded
        shell: bash
        run: |
          set -euo pipefail

          failed=0

          # Portable check (no associative arrays, works on bash 3.2+):
          # arg1=job name, arg2=result, arg3="yes" if 'skipped' is acceptable
          # (used only for integration-tests, and only when the event is not
          # a push to main — see integration_allow_skip below).
          check() {
            local job="$1" result="$2" allow_skip="$3"
            if [[ "$result" == "success" ]]; then
              return 0
            fi
            if [[ "$allow_skip" == "yes" && "$result" == "skipped" ]]; then
              return 0
            fi
            echo "::error::Required gate '$job' did not succeed (result: $result)"
            failed=1
          }

          # integration-tests is only exempt from the skip check on
          # non-main-push events (PRs, workflow_dispatch, etc). A push to
          # `refs/heads/main` requires an actual `success` result.
          is_main_push="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
          if [[ "$is_main_push" == "true" ]]; then
            integration_allow_skip=no
          else
            integration_allow_skip=yes
          fi

          check "bicep-validate"    "${{ needs.bicep-validate.result }}"    no
          check "lint-and-types"    "${{ needs.lint-and-types.result }}"    no
          check "import-boundaries" "${{ needs.import-boundaries.result }}" no
          check "pr-tests"          "${{ needs.pr-tests.result }}"          no
          check "integration-tests" "${{ needs.integration-tests.result }}" "$integration_allow_skip"
          check "bandit-scan"       "${{ needs.bandit-scan.result }}"       no
          check "secret-scan"       "${{ needs.secret-scan.result }}"       no
          check "iac-scan"          "${{ needs.iac-scan.result }}"          no

          if [[ "$failed" -eq 1 ]]; then
            echo "One or more required CI gates failed or were cancelled."
            exit 1
          fi
          echo "All required CI gates passed."
