name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint and type evaluation tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install isolated quality tools
        run: python -m pip install ruff==0.12.9 mypy==1.17.1
      - name: Ruff
        run: ruff check evaluation scripts/evaluation tests/evaluation --output-format=github
      - name: Mypy
        run: mypy --strict evaluation scripts/evaluation

  evaluation-tests:
    name: Deterministic evaluation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Compile evaluation Python
        run: python -m compileall -q evaluation scripts/evaluation tests/evaluation
      - name: Run isolated tests
        run: python -m unittest discover -s tests/evaluation -v

  security:
    name: Security and secret scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: python -m pip install bandit==1.8.6
      - name: Scan Python
        run: bandit -r evaluation scripts/evaluation -lll
      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: table

  iac:
    name: IaC validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect integration state
        id: surface
        shell: bash
        run: |
          if [[ -d infra ]] && find infra -type f -name '*.bicep' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::IaC is not integrated on this branch; no deployment evidence is produced."
          fi
      - name: Install Bicep
        if: steps.surface.outputs.present == 'true'
        run: az bicep install
      - name: Build and lint Bicep
        if: steps.surface.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            az bicep build --file "$file" --stdout > /dev/null
            az bicep lint --file "$file"
          done < <(find infra -name '*.bicep' -print0)
      - name: Scan IaC
        if: steps.surface.outputs.present == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  required-checks:
    name: Required checks
    if: always()
    needs:
      - lint-and-types
      - evaluation-tests
      - security
      - iac
    runs-on: ubuntu-latest
    steps:
      - name: Enforce blocking jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          failures = {
              name: value["result"]
              for name, value in results.items()
              if value["result"] != "success"
          }
          if failures:
              print(f"Blocking jobs did not succeed: {failures}", file=sys.stderr)
              raise SystemExit(1)
          PY
