[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intake-agent-workspace"
version = "0.1.0"
description = "Intake Agent — Python backend workspace"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "python-ulid>=2.2",
    "jsonschema>=4.23",
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.20",
    "azure-servicebus>=7.12",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "azure-monitor-opentelemetry>=1.3",
    "httpx>=0.27",
    "mcp>=1.29,<2",
    "PyJWT[crypto]>=2.10,<3",
    "agent-framework-foundry>=1.7,<2",
    "agent-framework-foundry-hosting>=1.0.0a260630,<2",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "httpx2>=2.0",
    "azure-functions>=1.21",
    "mypy>=1.10",
    "types-jsonschema>=4.23",
    "ruff>=0.4",
    "import-linter>=2.1",
    "coverage>=7.5",
    "bandit>=1.7.8,<2",
]
devui = [
    "agent-framework-devui>=1.0.0b260813,<2",
]

[project.scripts]
intake-demo = "intake_agent.main:cli"
intake-devui = "intake_agent.devui:run"
intake-mcp = "intake_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/intake_agent",
    "src/intake_domain",
    "src/intake_persistence",
    "src/intake_workers",
    "src/intake_mcp",
]

[tool.hatch.build.targets.sdist]
include = ["src/"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["intake_domain", "intake_persistence", "intake_agent", "intake_workers", "intake_mcp"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
# NOTE: pytest.ini is the authoritative pytest config (a top-level pytest.ini
# takes precedence over [tool.pytest.ini_options] and pytest never reads
# both). Do not add a [tool.pytest.ini_options] table here — it would be
# silently ignored and would misrepresent the real configuration.

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
# NOTE: .coveragerc is the single authoritative coverage config (source =
# src/intake_domain, fail_under = 80, branch = True). coverage.py resolves
# .coveragerc ahead of any [tool.coverage] table in this file, so a
# [tool.coverage] table here would be silently ignored — do not add one.
# The 80% gate applies specifically to intake_domain, matching
# docs/quality/test-strategy.md, not to all of src/.

# ---------------------------------------------------------------------------
# Import-linter
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "intake_domain",
    "intake_persistence",
    "intake_agent",
    "intake_workers",
    "intake_teams",
    "intake_mcp",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain has no external intake dependencies"
type = "forbidden"
source_modules = ["intake_domain"]
forbidden_modules = [
    "intake_persistence",
    "intake_agent",
    "intake_workers",
    "intake_teams",
    "azure",
]

[[tool.importlinter.contracts]]
name = "Persistence may not import agent/workers/teams"
type = "forbidden"
source_modules = ["intake_persistence"]
forbidden_modules = ["intake_agent", "intake_workers", "intake_teams"]

[[tool.importlinter.contracts]]
name = "Agent may not import workers/teams"
type = "forbidden"
source_modules = ["intake_agent"]
forbidden_modules = ["intake_workers", "intake_teams"]

[[tool.importlinter.contracts]]
name = "Requester tool boundary is transport neutral"
type = "forbidden"
source_modules = ["intake_agent.requester_tools"]
forbidden_modules = ["agent_framework", "mcp", "fastapi", "starlette", "azure"]

[[tool.importlinter.contracts]]
name = "Workers may not import agent/teams"
type = "forbidden"
source_modules = ["intake_workers"]
forbidden_modules = ["intake_agent", "intake_teams"]
