[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intake-agent-workspace"
version = "0.1.0"
description = "Intake Agent — Python backend workspace"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "python-ulid>=2.2",
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.20",
    "azure-servicebus>=7.12",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "azure-monitor-opentelemetry>=1.3",
    "agent-framework-foundry>=1.7,<2",
    "agent-framework-foundry-hosting>=1.0.0a260630,<2",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.4",
    "import-linter>=2.1",
    "coverage[toml]>=7.5",
]

[project.scripts]
intake-demo = "intake_agent.main:cli"

[tool.hatch.build.targets.wheel]
packages = [
    "src/intake_agent",
    "src/intake_domain",
    "src/intake_persistence",
    "src/intake_workers",
]

[tool.hatch.build.targets.sdist]
include = ["src/"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["intake_domain", "intake_persistence", "intake_agent", "intake_workers"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80

# ---------------------------------------------------------------------------
# Import-linter
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "intake_domain",
    "intake_persistence",
    "intake_agent",
    "intake_workers",
    "intake_teams",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain has no external intake dependencies"
type = "forbidden"
source_modules = ["intake_domain"]
forbidden_modules = [
    "intake_persistence",
    "intake_agent",
    "intake_workers",
    "intake_teams",
    "azure",
]

[[tool.importlinter.contracts]]
name = "Persistence may not import agent/workers/teams"
type = "forbidden"
source_modules = ["intake_persistence"]
forbidden_modules = ["intake_agent", "intake_workers", "intake_teams"]

[[tool.importlinter.contracts]]
name = "Agent may not import workers/teams"
type = "forbidden"
source_modules = ["intake_agent"]
forbidden_modules = ["intake_workers", "intake_teams"]

[[tool.importlinter.contracts]]
name = "Workers may not import agent/teams"
type = "forbidden"
source_modules = ["intake_workers"]
forbidden_modules = ["intake_agent", "intake_teams"]
