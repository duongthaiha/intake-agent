[project]
name = "intake-agent-foundation"
version = "0.1.0"
description = "Deterministic foundation and local profile for the Intake Agent MVP"
requires-python = ">=3.12,<3.15"
dependencies = [
    "intake-agent-behavior",
    "intake-agent-contracts",
    "intake-application",
    "intake-domain",
    "intake-foundry-hosted",
    "intake-foundry-prompt",
    "intake-mcp[server]",
    "intake-persistence",
    "intake-workers",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false
conflicts = [
    [
        { package = "intake-foundry-hosted", extra = "runtime" },
        { package = "intake-mcp", extra = "server" },
    ],
]

[tool.uv.sources]
intake-agent-behavior = { workspace = true }
intake-agent-contracts = { workspace = true }
intake-application = { workspace = true }
intake-domain = { workspace = true }
intake-mcp = { workspace = true }
intake-persistence = { workspace = true }
intake-workers = { workspace = true }
intake-foundry-hosted = { workspace = true }
intake-foundry-prompt = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
    "intake_agent_behavior",
    "intake_agent_contracts",
    "intake_application",
    "intake_domain",
    "intake_mcp",
    "intake_persistence",
    "intake_workers",
    "intake_foundry_hosted",
    "intake_foundry_prompt",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
