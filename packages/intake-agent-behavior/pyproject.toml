[project]
name = "intake-agent-behavior"
version = "1.0.0"
description = "Shared agent behavior specification for Intake Agent variants"
requires-python = ">=3.12,<3.15"
dependencies = [
    "intake-agent-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_agent_behavior"]

[tool.uv.sources]
intake-agent-contracts = { workspace = true }
