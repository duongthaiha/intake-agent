[pytest]
minversion = 7.0
testpaths = tests evaluation
pythonpath = src tests/fixtures
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    unit: Pure domain logic — no IO, no Azure.
    component: Command handlers with in-memory repositories — no Azure.
    contract: Schema and protocol compliance — no Azure.
    integration: LocalAdapter vertical flow — no Azure credentials required.
    azure: Real Azure resource required; skip unless INTAKE_RUN_AZURE_TESTS=1.
    slow: Takes >10 seconds.
    security: Security-focused tests.
    accessibility: Adaptive Card / accessibility static checks.
    evaluation: Evaluation dataset and scorecard tests.
filterwarnings =
    error
    ignore::DeprecationWarning:pydantic
    ignore::DeprecationWarning:pkg_resources
    ignore::ResourceWarning
